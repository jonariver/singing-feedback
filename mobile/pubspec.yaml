name: singing_feedback_mobile
description: Android/iOS-Client fuer den Singing-Feedback-Prototyp (Flutter, Phase-1-Paritaet mit frontend/app.js).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  provider: ^6.1.2
  # Bewusst auf 10.3.10 gepinnt statt ^11.0.0, siehe "Bekannter Workaround" in README.md
  # (file_picker >=11.0.0 bricht den Android-Build mit AGP 9 / Flutters Built-in-Kotlin-Migration).
  file_picker: 10.3.10
  record: ^7.0.0
  permission_handler: ^11.3.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
